name: Publish Docker Images

on:
  push:
    tags:
      - 'v*.*.*' # Trigger on tags like v1.0.0, v0.1.0, etc.

jobs:
  publish-simpleapp:
    name: Build and Publish SimpleApp Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta_simpleapp
        uses: docker/metadata-action@v5
        with:
          images: atjio/atjio-exercise-app
          tags: |
            type=semver,pattern={{version}} # Use the Git tag as Docker tag

      - name: Build and push SimpleApp Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./SimpleApp
          file: ./SimpleApp/Dockerfile
          push: true
          tags: ${{ steps.meta_simpleapp.outputs.tags }}
          labels: ${{ steps.meta_simpleapp.outputs.labels }}

  publish-loadbalancer:
    name: Build and Publish LoadBalancer Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta_loadbalancer
        uses: docker/metadata-action@v5
        with:
          images: atjio/atjio-exercise-loadbalancer
          tags: |
            type=semver,pattern={{version}} # Use the Git tag as Docker tag

      - name: Build and push LoadBalancer Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./LoadBalancer
          file: ./LoadBalancer/Dockerfile
          push: true
          tags: ${{ steps.meta_loadbalancer.outputs.tags }}
          labels: ${{ steps.meta_loadbalancer.outputs.labels }}
